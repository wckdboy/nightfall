name: Bug
description: Something produces the wrong result, crashes or regresses
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, input file or IR, and the exact command. Attach small files.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
