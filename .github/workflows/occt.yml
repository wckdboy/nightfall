#
# Builds OpenCASCADE at the pinned release (cached by build-script hash) and runs the OCCT
# geometry and evaluator tests. Runs nightly and on PRs touching the backend/service.
# The OCCT install is shared; Nightfall code is also checked under ASan/UBSan.

name: occt

on:
  # Runs on main too, so the OCCT install cache is saved where every PR can restore it
  # (caches saved on a PR ref are visible only to that PR).
  push:
    branches: [main]
    paths:
      - "third_party/occt/**"
      - "tools/bakeoff/**"
      - "tools/cli/**"
      - "core/**"
      - "services/kernel/**"
      - "app/**"
      - "tools/embed_service.py"
      - "examples/parts/**"
      - "third_party/build-occt.sh"
      - "tools/check.sh"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/occt.yml"
  pull_request:
    paths:
      - "third_party/occt/**"
      - "tools/bakeoff/**"
      - "tools/cli/**"
      - "core/**"
      - "services/kernel/**"
      - "app/**"
      - "tools/embed_service.py"
      - "examples/parts/**"
      - "third_party/build-occt.sh"
      - "tools/check.sh"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/occt.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occt-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish (they save the cache).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  occt:
    name: occt build + smoke tests (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install ninja python@3.14
      - name: Install schema test tooling
        run: |
          python3.14 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet -r tools/schema-requirements.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      # Restore and save are separate steps so a slow OCCT build is cached even when a later
      # test step fails (actions/cache's combined form saves only when the whole job passes).
      - name: Restore OCCT install
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/install
          key: occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/build-occt.sh') }}

      - name: Build OCCT
        if: steps.cache.outputs.cache-hit != 'true'
        run: third_party/build-occt.sh

      - name: Save OCCT install
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/install
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - run: tools/check.sh --preset occt --skip-format
      - name: Sanitize Swift worker concurrency
        run: |
          cmake --preset occt -B build/swift-tsan -DNF_BUILD_XPC_BUNDLE=OFF -DCMAKE_Swift_FLAGS=-sanitize=thread -DFETCHCONTENT_SOURCE_DIR_CATCH2="$PWD/build/occt/_deps/catch2-src"
          cmake --build build/swift-tsan --target nf_native_worker_tests --parallel 2
          ctest --test-dir build/swift-tsan -R '^native\.' --output-on-failure
      - name: Sanitize production geometry and evaluator ownership
        run: |
          cmake --preset asan -DNF_WITH_OCCT=ON
          cmake --build --preset asan --target nf_kernel_tests nf_kernel_cache_tests nf_evaluator_tests nf_cli_tests nf_bridge_tests nf_bridge_c_smoke --parallel 2
          ctest --preset asan -R '^(kernel\.|kernel-cache\.|evaluator\.|cli\.|bridge\.)'
