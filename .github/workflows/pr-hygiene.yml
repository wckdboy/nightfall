#
# Required check on every PR: Conventional Commit title, DCO sign-off on every commit,
# and a linked issue (WORKFLOW.md §1–2).

name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|rfc)(\((math|svg|ir|kernel|usd|script|app|viewport|sketch|agent|cli|evals|third_party|process)\))?!?: .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be '<type>(<scope>): <summary>' (WORKFLOW.md §2). Got: $TITLE"
            exit 1
          fi

      - name: DCO sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by (use git commit -s)"
              bad=1
            fi
          done
          exit $bad

      - name: Linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Docs-only typo fixes may skip the issue by including "no-issue: typo" in the body.
          if [[ "$BODY" =~ (Closes|Fixes|Resolves)\ #[0-9]+ ]] || [[ "$BODY" == *"no-issue: typo"* ]]; then
            exit 0
          fi
          echo "::error::PR body must contain 'Closes #<issue>' (WORKFLOW.md §1)."
          exit 1
