#
# Nightly ASan/UBSan build. A failure here is a release blocker (WORKFLOW.md §6).

name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: asan-ubsan (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install ninja python@3.14
      - run: rustup show
      - name: Install schema test tooling
        run: |
          python3.14 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet -r tools/schema-requirements.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - run: tools/check.sh --preset asan --skip-format
