[workspace]
members = ["core/math/rust", "core/assembly/rust", "core/kernel/native", "core/kernel/rust", "core/sketch/rust", "core/sketch/ffi"]
exclude = ["third_party/solidcraft-sketch/sketch", "third_party/solidcraft-sketch/geom"]
default-members = ["core/math/rust"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
